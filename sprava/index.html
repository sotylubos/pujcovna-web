<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Správa – Půjčovna Žďár</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1F4D3A">
<link rel="manifest" href="/sprava/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/sprava/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5F0;--ink:#16211C;--muted:#5A6660;--line:#E4E0D6;--green:#1F4D3A;--gsoft:#E6EFE9;--accent:#FF7A3D;--warn:#8A2E0A;--wsoft:#FCE9DF;--head:'Bricolage Grotesque',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit}
a{color:var(--green)}
.top{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px}
.top h1{margin:0;font-family:var(--head);font-weight:800;font-size:20px;letter-spacing:-.02em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.cal .fab{display:none}
body.cal main{padding-top:8px}
body.cal .cal-wrap{padding:8px}
body.cal .cal-nav{margin-bottom:4px}
body.cal .cal-nav button{width:40px;height:40px}
.top button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:999px;min-height:40px;padding:0 14px;font-weight:600;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{background:none;border:0;padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;position:relative;min-height:60px}
.tabs button[aria-current="page"]{color:var(--green)}
.tabs svg{width:24px;height:24px}
.badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--accent);color:var(--ink);font-size:11px;font-weight:800;border-radius:999px;min-width:18px;height:18px;line-height:18px;padding:0 5px}
h2{font-family:var(--head);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:8px 0 14px}
.empty{background:#fff;border-radius:18px;padding:28px;text-align:center;color:var(--muted)}
.card{background:#fff;border-radius:20px;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.item{font-family:var(--head);font-weight:800;font-size:20px;letter-spacing:-.01em;margin:0}
.dates{font-weight:700;font-size:16px}
.muted{color:var(--muted)}
.code{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.who{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:15px}
.who a{font-weight:600;text-decoration:none}
.note{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px;white-space:pre-wrap}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--bg);color:var(--ink)}
.tag.ok{background:var(--gsoft);color:var(--green)}
.tag.warn{background:var(--wsoft);color:var(--warn)}
.tag.new{background:var(--accent);color:var(--ink)}
.money{display:flex;gap:16px;font-size:14px;flex-wrap:wrap}
.money b{font-size:16px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:0;border-radius:999px;min-height:46px;padding:0 18px;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--green);color:#fff;flex:1}
.btn.accent{background:var(--accent);color:var(--ink)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid #CFCAC0}
.btn.danger{background:#fff;color:var(--warn);border:1.5px solid #E8C2AF}
.btn:disabled{opacity:.5}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:6;background:var(--accent);color:var(--ink);border:0;border-radius:999px;height:56px;padding:0 20px;font-weight:800;font-size:15px;box-shadow:0 8px 24px rgba(22,33,28,.25);cursor:pointer;display:flex;align-items:center;gap:8px}
.sheet-bg{position:fixed;inset:0;background:rgba(22,33,28,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:24px}}
.sheet h3{margin:0;font-family:var(--head);font-weight:800;font-size:22px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
label.f input,label.f textarea,label.f select{border:1.5px solid #D8D3C8;border-radius:12px;padding:12px;background:#FBFAF7;font-size:16px;color:var(--ink)}
label.f textarea{min-height:200px;line-height:1.45}
.choices{display:grid;grid-template-columns:1fr;gap:8px}
.login{max-width:420px;margin:12vh auto 0;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.login h2{font-size:34px}
.cal-wrap{background:#fff;border-radius:20px;padding:12px;overflow-x:auto}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-nav b{font-family:var(--head);font-size:20px;text-transform:capitalize}
.cal-nav button{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px}
table.tl{border-collapse:separate;border-spacing:2px;font-size:11px}
table.tl th{font-weight:600;color:var(--muted);text-align:center;min-width:22px}
table.tl th.we{color:var(--warn)}
table.tl td{height:30px;min-width:22px;border-radius:5px;background:var(--bg);padding:0}
table.tl td.lbl{background:none;font-weight:700;font-size:13px;white-space:nowrap;padding-right:8px;position:sticky;left:0;background:#fff}
table.tl td.c{background:var(--green);cursor:pointer}
table.tl td.p{background:var(--accent);cursor:pointer}
table.tl td.t{box-shadow:inset 0 0 0 2px var(--ink)}
.kgrid{display:flex;flex-direction:column;gap:1px}
.kr{display:grid;grid-template-columns:42px repeat(var(--n),minmax(0,1fr));gap:2px;align-items:stretch}
.kr.we .kd{color:#8A2E0A}
.kr.today .kd{background:var(--accent);color:var(--ink);border-radius:8px}
.kh{position:sticky;top:56px;background:#fff;z-index:2;padding-bottom:4px}
.kh .kc{background:none;font-size:11px;font-weight:700;text-align:center;color:var(--ink);min-height:0;padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kd{display:flex;gap:3px;padding:0 4px;font-size:11px;color:var(--muted);min-height:19px;align-items:center}
.kd b{color:inherit;font-size:12px}
.kr.we .kd b,.kr.today .kd b{color:inherit}
.kc{min-height:19px;line-height:19px;background:var(--bg);border:0;padding:0 3px;font-size:10px;font-weight:700;color:#fff;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-family:inherit}
.kc.on{background:var(--green);cursor:pointer}
.kc.cl{background:repeating-linear-gradient(45deg,#cfc7ba,#cfc7ba 3px,#eee8de 3px,#eee8de 6px)}
.kc.on.p{background:var(--accent);color:var(--ink)}
.kc.on.r{background:#9DB5A8;color:var(--ink)}
.kc.st{border-top-left-radius:8px;border-top-right-radius:8px}
.kc.en{border-bottom-left-radius:8px;border-bottom-right-radius:8px}
.kc:not(.on){border-radius:4px}
i.lg{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:30;max-width:90vw}
#hq{min-height:44px;border:1.5px solid #CFCAC0;border-radius:12px;padding:0 14px;font:inherit;background:#fff}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg button{border:1.5px solid #CFCAC0;background:#fff;border-radius:999px;min-height:40px;padding:0 14px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
</style>
</head>
<body>
<div id="app"><div class="login"><p class="muted">Načítám…</p></div></div>
<script type="module" src="/sprava/app.js"></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sprava/sw.js',{scope:'/sprava/'})}</script>
</body>
</html>
